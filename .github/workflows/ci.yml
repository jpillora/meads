name: CI
on:
  pull_request: {}
  push: {}
permissions: write-all
jobs:
  # ================
  # BUILD AND TEST JOB
  # ================
  test:
    name: Build & Test
    strategy:
      matrix:
        # optionally test/build across multiple platforms/Go-versions
        go-version: ['stable'] # '1.14', '1.17', '1.20,
        platform: [ubuntu-latest] # , macos-latest, windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: Build
        run: go build -v -o /dev/null ./cmd/md
      - name: Test
        run: go test -v ./...
  # ================
  # RELEASE BINARIES (on push "v*" tag)
  # ================
  release_binaries:
    name: Release Binaries
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: release --config .github/goreleaser.yml
  # ================
  # RELEASE VS CODE EXTENSION (.vsix on push "v*" tag)
  # ================
  release_vscode:
    name: Release VS Code Extension
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Sync version from tag
        run: node scripts/sync-version.mjs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Build bundle
        run: npm run build
      - name: Package .vsix
        run: npx vsce package --no-dependencies --out "meads-${{ github.ref_name }}.vsix"
      - name: Upload .vsix to release
        uses: softprops/action-gh-release@v2
        with:
          files: vscode/meads-${{ github.ref_name }}.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
