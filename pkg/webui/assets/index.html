<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meads</title>
<link rel="stylesheet" href="/app.css">
<!-- No-build dependency resolution: bare specifiers map to vendored ESM files
     under /vendor (embedded via go:embed). See assets/vendor/README.md. -->
<script type="importmap">
{
  "imports": {
    "marked": "/vendor/marked.esm.js",
    "dompurify": "/vendor/purify.es.mjs"
  }
}
</script>
</head>
<body>
<header class="bar">
  <div class="title">
    <strong id="file-path">TASKS.md</strong>
    <span id="file-meta" class="muted"></span>
  </div>
  <div class="actions">
    <input type="search" id="filter" placeholder="Filter…  (/ to focus)" autocomplete="off">
    <div class="overflow-group">
      <select id="sort-by" title="Sort tasks">
        <option value="default">Sort: status</option>
        <option value="priority">Sort: priority</option>
        <option value="id">Sort: id</option>
        <option value="updated">Sort: updated</option>
      </select>
      <label class="toggle" title="Show status group headers">
        <input type="checkbox" id="group-by-status"> group
      </label>
      <label class="toggle" title="Show tasks with status=closed">
        <input type="checkbox" id="show-closed"> show closed
      </label>
      <label class="toggle" title="Compact one-line rows">
        <input type="checkbox" id="compact"> compact
      </label>
      <button id="copy-url" title="Copy share URL (with token)">copy URL</button>
      <button id="help-toggle" title="Keyboard shortcuts (?)">?</button>
    </div>
    <button id="new-task">+ New task</button>
    <button id="overflow-toggle" title="More options" aria-expanded="false" aria-haspopup="true">⋮</button>
  </div>
</header>

<main id="list" aria-live="polite"></main>

<dialog id="editor">
  <form method="dialog" id="editor-form">
    <h2 id="editor-title">New task</h2>
    <label>Title <input name="title" required></label>
    <div class="row">
      <label>Type
        <select name="type">
          <option value="task">task</option>
          <option value="bug">bug</option>
          <option value="feature">feature</option>
          <option value="idea">idea</option>
        </select>
      </label>
      <label>Priority
        <select name="priority">
          <option value="P0">P0</option>
          <option value="P1">P1</option>
          <option value="P2" selected>P2</option>
          <option value="P3">P3</option>
          <option value="P4">P4</option>
        </select>
      </label>
      <label>Status
        <select name="status">
          <option value="draft">draft</option>
          <option value="open" selected>open</option>
          <option value="inprogress">inprogress</option>
          <option value="blocked">blocked</option>
          <option value="closed">closed</option>
        </select>
      </label>
    </div>
    <label id="reason-field" hidden>Status reason
      <input name="status_reason" id="editor-reason" autocomplete="off" placeholder="Why blocked/closed (optional)">
    </label>
    <label for="editor-description">Description</label>
    <div class="md-editor">
      <div class="md-toolbar" role="toolbar" aria-label="Format">
        <button type="button" data-md="bold" title="Bold"><strong>B</strong></button>
        <button type="button" data-md="italic" title="Italic"><em>I</em></button>
        <button type="button" data-md="code" title="Inline code"><code>&lt;/&gt;</code></button>
        <button type="button" data-md="link" title="Link">link</button>
        <button type="button" data-md="ul" title="Bulleted list">• list</button>
        <button type="button" data-md="ol" title="Numbered list">1. list</button>
        <button type="button" data-md="heading" title="Heading (cycles H1→H2→H3→off)">H</button>
      </div>
      <textarea id="editor-description" name="description" rows="5" class="md-source"
        placeholder="Markdown supported — use the toolbar above"></textarea>
      <div class="md-preview" aria-live="polite"></div>
    </div>
    <label for="dep-search">Depends on</label>
    <div class="dep-picker">
      <div class="dep-chips" id="dep-chips"></div>
      <input id="dep-search" type="text" class="dep-search" placeholder="Search tasks by id or title…" autocomplete="off">
      <div class="dep-results" id="dep-results" hidden></div>
      <input type="hidden" name="depends_on" id="depends_on">
    </div>
    <div class="footer">
      <button type="button" data-action="cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="help">
  <h2>Keyboard shortcuts</h2>
  <dl class="shortcuts">
    <dt>j / k</dt><dd>Move focus down / up between cards</dd>
    <dt>n</dt><dd>New task</dd>
    <dt>e</dt><dd>Edit focused task</dd>
    <dt>d</dt><dd>Delete focused task (asks first)</dd>
    <dt>Enter</dt><dd>Run the focused task's primary action (Start / Done / Reopen)</dd>
    <dt>/</dt><dd>Focus the filter input</dd>
    <dt>Esc</dt><dd>Clear filter / close dialog</dd>
    <dt>?</dt><dd>Toggle this help</dd>
  </dl>
  <div class="footer">
    <button type="button" data-action="close-help">Close</button>
  </div>
</dialog>

<template id="task-card">
  <article class="card">
    <header>
      <span class="id"></span>
      <span class="title"></span>
      <span class="chips"></span>
      <span class="deps"></span>
    </header>
    <div class="description"></div>
    <footer>
      <button data-action="status-next">Advance status</button>
      <select data-action="set-status" class="status-menu" title="Set status" aria-label="Set status"></select>
      <button data-action="edit">Edit</button>
      <button data-action="delete" class="danger">Delete</button>
    </footer>
  </article>
</template>

<script type="module" src="/app.js"></script>
</body>
</html>
