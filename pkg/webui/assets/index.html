<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meads</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="bar">
  <div class="title">
    <strong id="file-path">TASKS.md</strong>
    <span id="file-meta" class="muted"></span>
  </div>
  <div class="actions">
    <input type="search" id="filter" placeholder="Filter…" autocomplete="off">
    <button id="new-task">+ New task</button>
  </div>
</header>

<main id="list" aria-live="polite"></main>

<dialog id="editor">
  <form method="dialog" id="editor-form">
    <h2 id="editor-title">New task</h2>
    <label>Title <input name="title" required></label>
    <div class="row">
      <label>Type
        <select name="type">
          <option value="task">task</option>
          <option value="bug">bug</option>
          <option value="feature">feature</option>
          <option value="idea">idea</option>
        </select>
      </label>
      <label>Priority
        <select name="priority">
          <option value="P0">P0</option>
          <option value="P1">P1</option>
          <option value="P2" selected>P2</option>
          <option value="P3">P3</option>
          <option value="P4">P4</option>
        </select>
      </label>
      <label>Status
        <select name="status">
          <option value="draft">draft</option>
          <option value="open" selected>open</option>
          <option value="inprogress">inprogress</option>
          <option value="closed">closed</option>
        </select>
      </label>
    </div>
    <label>Description
      <textarea name="description" rows="6"></textarea>
    </label>
    <label>Depends on (comma-separated IDs)
      <input name="depends_on" placeholder="e.g. 1, 2">
    </label>
    <div class="footer">
      <button type="button" data-action="cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<template id="task-card">
  <article class="card">
    <header>
      <span class="id"></span>
      <span class="title"></span>
      <span class="chips"></span>
      <span class="deps"></span>
    </header>
    <div class="description"></div>
    <footer>
      <button data-action="status-next">Advance status</button>
      <button data-action="edit">Edit</button>
      <button data-action="delete" class="danger">Delete</button>
    </footer>
  </article>
</template>

<script type="module" src="/app.js"></script>
</body>
</html>
